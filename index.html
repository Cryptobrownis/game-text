<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Malam Hasrat & Godaan Intim 21+</title>
    <style>
        :root {
            --bg-dark: #08030b;
            --card-bg: #15081c;
            --accent-pink: #ff0055;
            --accent-purple: #ab47bc;
            --text-light: #f8edf9;
            --text-muted: #b091ba;
            --btn-accept: rgba(46, 125, 50, 0.45);
            --btn-reject: rgba(198, 40, 40, 0.45);
            --border-accept: #4caf50;
            --border-reject: #ef5350;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .novel-card {
            width: 100%;
            max-width: 450px;
            background-color: var(--card-bg);
            border: 1px solid #361244;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(255, 0, 85, 0.2);
            display: flex;
            flex-direction: column;
            min-height: 88vh;
            justify-content: space-between;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #361244;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-pink);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge-21 {
            display: inline-block;
            background-color: var(--accent-pink);
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 6px;
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .scene-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-purple);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .story-text {
            font-size: 0.95rem;
            line-height: 1.68;
            color: var(--text-light);
            text-align: justify;
            margin-bottom: 12px;
        }

        .response-box {
            font-size: 0.9rem;
            line-height: 1.5;
            padding: 12px;
            border-radius: 10px;
            margin-top: 8px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .res-accept {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid var(--border-accept);
            color: #a5d6a7;
        }

        .res-reject {
            background: rgba(239, 83, 80, 0.15);
            border: 1px solid var(--border-reject);
            color: #ef9a9a;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            border: 1px solid transparent;
            color: #ffffff;
            transition: transform 0.1s ease;
            line-height: 1.4;
        }

        .btn-accept {
            background-color: var(--btn-accept);
            border-color: var(--border-accept);
        }

        .btn-reject {
            background-color: var(--btn-reject);
            border-color: var(--border-reject);
        }

        .btn-next {
            background-color: var(--accent-purple);
            border-color: #e1bee7;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .ending-box {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--accent-pink);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-top: 10px;
        }

        .ending-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-pink);
            margin-bottom: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="novel-card">
    <div class="header">
        <div class="title">Goda & Hasrat <span class="badge-21">21+</span></div>
        <div class="progress-text" id="progress-text">Novel Interaktif Dewasa</div>
    </div>

    <div class="content-area">
        <div id="scene-title" class="scene-title"></div>
        <div id="story-text" class="story-text"></div>
        <div id="response-box" class="response-box"></div>
    </div>

    <div id="btn-container" class="btn-container"></div>
</div>

<script>
    let currentScene = 0;
    let acceptCount = 0;
    let rejectCount = 0;

    const scenes = [
        {
            title: "Bab 1: Pintu Kamar Yang Terkunci",
            text: "Lampu kamar diredupkan hingga menyisakan bayangan temaram. Pasanganmu melangkah perlahan mengunci pintu, lalu berbalik dengan gaun sutra tipis yang melekat menggoda di lekuk tubuhnya. 'Malam ini, kamu tidak boleh melarikan diri dariku...' bisiknya dengan tatapan menantang.",
            acceptText: "♥ Penerimaan: Tarik pinggangnya rapat dan bisikkan bahwa kamu tak berniat kabur.",
            rejectText: "✖ Penolakan: Silangkan tangan di dada dan minta ia membuktikan godaannya dahulu.",
            resAccept: "Alur Penerimaan: Senyum nakal terukir di bibirnya. Ia menyusupkan jemarinya ke rambut belakangmu, memangkas habis jarak yang ada.",
            resReject: "Alur Penolakan: Matanya menyala penuh tantangan. Ia tertawa manja, merasa tertantang oleh sikapmu yang tidak mudah menyerah."
        },
        {
            title: "Bab 2: Bisikan Beracun di Leher",
            text: "Ia mendekatkan bibirnya tepat di bawah telingamu. Hembusan napas panasnya membuat bulu kudukmu merinding. 'Sensasi dingin di luar tak ada artinya dibandingkan panas yang ingin kubagikan padamu,' gumamnya vulgar.",
            acceptText: "♥ Penerimaan: Miringkan kepala memberi akses penuh bagi bibirnya untuk menjelajah.",
            rejectText: "✖ Penolakan: Tahan bahunya pelan, meminta ia tidak terburu-buru membakar suasana.",
            resAccept: "Alur Penerimaan: Kecupan-kecupan basah mendarat lembut namun intens di sepanjang lehermu, memicu desahan halus yang tak tertahankan.",
            resReject: "Alur Penolakan: Ia menggigit bibir bawahnya gemas, memperlambat gerakannya sambil mengusap dadamu penuh kesabaran."
        },
        {
            title: "Bab 3: Jejak Jemari Licik",
            text: "Jemari lentiknya yang hangat mulai merambat turun dari dada menuju kancing dan ikatan pakaianmu, bergerak pelan seolah sedang memainkan instrumen musik yang sensitif.",
            acceptText: "♥ Penerimaan: Bantu ia melucuti pakaianmu hingga kontak kulit terasa langsung.",
            rejectText: "✖ Penolakan: Pegang pergelangan tangannya untuk menahan laju jarinya sejenak.",
            resAccept: "Alur Penerimaan: Pelepasan kain disambut sentuhan kulit ke kulit yang seketika menyebarkan gelombang panas ke seluruh raga.",
            resReject: "Alur Penolakan: Ia menatap matamu dalam-dalam, lalu memindahkan tangannya untuk meremas lembut tengkukmu."
        },
        {
            title: "Bab 4: Sentuhan Es Batu & Panas Tubuh",
            text: "Ia mengambil sepotong es batu dingin, menempelkannya sejenak di bibirnya sebelum menatap dadamu yang hangat. 'Mari kita lihat seberapa tahan tubuhmu menerima kontras dingin dan panas ini...'",
            acceptText: "♥ Penerimaan: Pasrahkan tubuhmu saat es dingin menyapu kulit hangatmu.",
            rejectText: "✖ Penolakan: Rebut es batu itu dan lemparkan balik godaan dingin ke tubuhnya.",
            resAccept: "Alur Penerimaan: Lelehan es berpadu napas membara memicu getaran hebat di sejujur raga. Ia sangat menikmati eranganmu.",
            resReject: "Alur Penolakan: Tindak balikmu membuatnya terperanjat gembira. Pekikan manja lolos saat kamu ganti menguasai jalannya godaan."
        },
        {
            title: "Bab 5: Ikatan Sutra Merah",
            text: "Ia mengeluarkan seutas kain sutra merah lembut. 'Serahkan kendalimu malam ini. Biarkan aku mengikat kedua tanganmu agar kamu hanya bisa menikmati setiap sentuhanku.'",
            acceptText: "♥ Penerimaan: Serahkan kedua pergelangan tanganmu untuk diikat secara pasrah.",
            rejectText: "✖ Penolakan: Gelengkan kepala dan balikkan posisi hingga kamu yang berada di atas.",
            resAccept: "Alur Penerimaan: Ia mengikat pergelangan tanganmu dengan telaten, menatapmu penuh kemenangan dan kepuasan sensual.",
            resReject: "Alur Penolakan: Dominasi balik darimu membuat napasnya seketika memburu. Matanya membelalak penuh gairah liar."
        },
        {
            title: "Bab 6: Bisikan Fantasi Liar",
            text: "Dalam pautan yang kian rapat, ia membisikkan imajinasi sensual paling vulgar dan berani tentang apa yang ingin ia lakukan padamu dalam penyatuan malam ini.",
            acceptText: "♥ Penerimaan: Bisikkan persetujuanmu dan minta ia mewujudkannya sekarang.",
            rejectText: "✖ Penolakan: Bungkam bibirnya dengan ciuman dalam untuk mengalihkan kata-kata.",
            resAccept: "Alur Penerimaan: Persetujuanmu meledakkan gejolak gairah yang tak tertahankan. Ritme penyatuan dimulai dengan sangat intens.",
            resReject: "Alur Penolakan: Ciuman dalam itu menyerap seluruh napasnya, mengalihkan fantasi verbal menjadi pergerakan raga yang makin dalam."
        },
        {
            title: "Bab 7: Harmoni Penyatuan Raga",
            text: "Kini tak ada lagi jarak atau penghalang. Keringat tipis melapisi kulit saat ritme pergerakan tubuh mulai berpacu mengikuti naluri dasar gairah.",
            acceptText: "♥ Penerimaan: Ikuti ritme cepat dan agresif yang ia berikan.",
            rejectText: "✖ Penolakan: Tahan pinggulnya dan minta memperlambat tempo agar sensasi bertahan lama.",
            resAccept: "Alur Penerimaan: Tempo cepat membawa kalian melayang dalam gelombang kenikmatan sensual yang meluap-luap.",
            resReject: "Alur Penolakan: Tempo lambat yang sangat halus menciptakan ketegangan sensual yang menyiksa namun sangat nikmat."
        },
        {
            title: "Bab 8: Ujian Ketahanan Sensual",
            text: "Sensasi panas membakar di ambang batas. Ia menatap matamu tajam di tengah gesekan raga, menantangmu untuk menahan pelepasan gairah sedikit lebih lama.",
            acceptText: "♥ Penerimaan: Tahan napasmu dan ikuti permainan kontrol ketahanan raga.",
            rejectText: "✖ Penolakan: Biarkan pelepasan terjadi tanpa perlu menahannya lagi.",
            happyRes: "Alur Penerimaan: Ketahanan ragamu membuat tubuhnya bergetar hebat. Kenikmatan yang ditahan terasa berlipat ganda!",
            resReject: "Alur Penolakan: Pelepasan instan meledakkan kepuasan mendadak yang membuat kalian berdua terengah-engah pasrah."
        },
        {
            title: "Bab 9: Puncak Gelora Tanpa Batas",
            text: "Puncak kehangatan menyapu seluruh raga secara menggelegar. Suara desahan dan pautan erat jemari menjadi saksi penyatuan paling dalam malam ini.",
            acceptText: "♥ Penerimaan: Peluk tubuhnya sekuat tenaga dalam gejolak puncak.",
            rejectText: "✖ Penolakan: Biarkan tubuh pasrah terkulai menikmati sisa gelombang gairah.",
            resAccept: "Alur Penerimaan: Pelukan erat di momen puncak menyatukan jiwa dan fisik dalam kebahagiaan sensual yang sempurna.",
            resReject: "Alur Penolakan: Kepasrahan total membuat tubuh kalian rileks sepenuhnya saat detak jantung perlahan berangsur teratur."
        },
        {
            title: "Bab 10: Dekapan & Sisa Kehangatan",
            text: "Deru napas berangsur tenang di bawah remang lampu. Ia merebahkan kepalanya di dadamu, menatapmu dengan sisa-sisa tatapan penuh kehangatan dan cinta.",
            acceptText: "♥ Penerimaan: Selimuti tubuh kalian berdua dan tarik ia ke dalam pelukan hangat.",
            rejectText: "✖ Penolakan: Kecup keningnya lembut lalu berbaring berdampingan sambil menggenggam jemarinya.",
            resAccept: "Alur Penerimaan: Ia menyusupkan wajahnya di lehermu, merasa sangat dilindungi dan dipuaskan secara utuh.",
            resReject: "Alur Penolakan: Sambil menggenggam jemarimu erat, ia tersenyum menikmati kedamaian malam yang membungkus kalian."
        }
    ];

    function renderScene() {
        if (currentScene >= scenes.length) {
            renderEnding();
            return;
        }

        const data = scenes[currentScene];
        document.getElementById('progress-text').innerText = `Bab ${currentScene + 1} dari ${scenes.length}`;
        document.getElementById('scene-title').innerText = data.title;
        document.getElementById('story-text').innerText = data.text;
        document.getElementById('response-box').style.display = 'none';

        const btnContainer = document.getElementById('btn-container');
        btnContainer.innerHTML = `
            <button class="btn btn-accept" onclick="handleChoice('accept')">${data.acceptText}</button>
            <button class="btn btn-reject" onclick="handleChoice('reject')">${data.rejectText}</button>
        `;
    }

    function handleChoice(type) {
        const data = scenes[currentScene];
        const resBox = document.getElementById('response-box');

        if (type === 'accept') {
            acceptCount++;
            resBox.className = "response-box res-accept";
            resBox.innerText = data.resAccept || data.happyRes;
        } else {
            rejectCount++;
            resBox.className = "response-box res-reject";
            resBox.innerText = data.resReject;
        }

        resBox.style.display = 'block';

        const btnContainer = document.getElementById('btn-container');
        btnContainer.innerHTML = `
            <button class="btn btn-next" onclick="nextScene()">Lanjutkan Cerita ▶</button>
        `;
    }

    function nextScene() {
        currentScene++;
        renderScene();
    }

    function renderEnding() {
        document.getElementById('progress-text').innerText = "EPILOG / HASIL AKHIR CERITA";
        const resBox = document.getElementById('response-box');
        resBox.style.display = 'none';

        let endingTitle = "";
        let endingText = "";

        if (acceptCount >= 7) {
            endingTitle = "ENDING 1: PASRAH DALAM GELORA (Full Acceptance)";
            endingText = "Dominasi pilihan penerimaan membuat malam ini terbakar dalam gelora vulgar tanpa hambatan. Setiap godaan liar disambut dengan kepasrahan raga yang sempurna. Kalian berdua tenggelam dalam puncak kepuasan fisik dan emosional tingkat tertinggi.";
        } else if (rejectCount >= 7) {
            endingTitle = "ENDING 2: PERMAINAN GODAAN DINGIN (High Rejection / Tease)";
            endingText = "Penolakan dan batasan yang sering kamu berikan justru membuat pasanganmu makin penasaran dan frustrasi gairah. Malam berakhir dengan permainan godaan yang menahan kepuasan, menyisakan rasa penasaran mendalam untuk pertempuran intim berikutnya.";
        } else {
            endingTitle = "ENDING 3: HARMONI GODAAN & HASRAT (Mixed Choice Ending)";
            endingText = "Kombinasi seimbang antara penerimaan dan penolakan menciptakan dinamika sensual yang sangat kaya. Ada saatnya kamu pasrah menikmati godaan vulgar, dan ada saatnya kamu mengambil kendali dengan penolakan manis. Malam berakhir dengan harmoni gairah yang sempurna.";
        }

        document.getElementById('scene-title').innerText = "BAB AKHIR: EPILOG MALAM";
        document.getElementById('story-text').innerHTML = `
            Suara hujan di luar telah reda, menyisakan keheningan malam yang damai membungkus kalian berdua.<br><br>
            <div class="ending-box">
                <div class="ending-title">${endingTitle}</div>
                <div style="font-size: 0.92rem; line-height: 1.5;">${endingText}</div>
            </div><br>
            <b>Rekapitulasi Keputusan Anda:</b><br>
            - Keputusan Penerimaan: <b>${acceptCount}</b> kali<br>
            - Keputusan Penolakan: <b>${rejectCount}</b> kali
        `;

        document.getElementById('btn-container').innerHTML = `
            <button class="btn btn-next" onclick="restartStory()">Baca Ulang Novel ↺</button>
        `;
    }

    function restartStory() {
        currentScene = 0;
        acceptCount = 0;
        rejectCount = 0;
        renderScene();
    }

    renderScene();
</script>
</body>
</html>
