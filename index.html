<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Malam di Ambang Hasrat</title>
    <style>
        :root {
            --bg-color: #0d0914;
            --card-bg: #181124;
            --accent-color: #e91e63;
            --text-color: #ece6f0;
            --text-muted: #9a8c9e;
            --btn-terima: #2e7d32;
            --btn-tolak: #c62828;
            --btn-hover: #371d45;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid #332042;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 82vh;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #332042;
            padding-bottom: 12px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f48fb1;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
        }

        .scene-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ce93d8;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .story-text {
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 12px;
            text-align: justify;
        }

        .response-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ffd54f;
            background: rgba(255, 213, 79, 0.08);
            border-left: 3px solid #ffd54f;
            padding: 10px 12px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #2a1a35;
            border: 1px solid #6a1b9a;
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-terima {
            border-color: #4caf50;
        }

        .btn-tolak {
            border-color: #ef5350;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .ending-box {
            text-align: center;
            padding: 16px;
            background: rgba(156, 39, 176, 0.1);
            border-radius: 12px;
            border: 1px solid #ab47bc;
        }

        .ending-type {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff80ab;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">Malam di Ambang Hasrat</div>
        <div class="subtitle" id="progress">Cerita Interaktif</div>
    </div>

    <div class="content" id="game-content">
        <!-- Konten cerita diisi via JS -->
    </div>

    <div class="options-container" id="options-container">
        <!-- Pilihan tombol diisi via JS -->
    </div>
</div>

<script>
    let currentScene = 0;
    let feedbackText = "";
    let terimaCount = 0;
    let tolakCount = 0;

    const gameContent = document.getElementById('game-content');
    const optionsContainer = document.getElementById('options-container');
    const progressText = document.getElementById('progress');

    function initGame() {
        progressText.innerText = "Menu Utama";
        gameContent.innerHTML = `
            <div class="story-text" style="text-align: center;">
                Pilih sudut pandang karakter Anda untuk memulai cerita.
            </div>
        `;
        optionsContainer.innerHTML = `
            <button class="btn" onclick="startGame('Pria')">1. Saya Pria (Pasangan Wanita)</button>
            <button class="btn" onclick="startGame('Wanita')">2. Saya Wanita (Pasangan Pria)</button>
        `;
    }

    function startGame() {
        currentScene = 1;
        terimaCount = 0;
        tolakCount = 0;
        feedbackText = "";
        renderScene();
    }

    const scenes = {
        1: {
            title: "SCENE 1: BISIKAN DI TENGAH HUJAN",
            text: "Hujan deras mengguyur jendela. Pasanganmu mendekat, membisikkan kata-kata manis tepat di telingamu lalu mencoba merangkul pinggangmu rapat-rapat.",
            terimaText: "Menerima rangkulannya dan bersandar rapat pada dadanya.",
            tolakText: "Menolak dengan menahan dadanya lembut, memberinya jarak sejenak.",
            resTerima: "Kamu membiarkan tubuhmu menyatu dalam kehangatan pelukannya. Napasnya menghembus lega dan penuh ketenangan.",
            resTolak: "Kamu menahannya. Dia tersenyum menggodamu, tatapan matanya makin penasaran dengan penolakan halusmu."
        },
        2: {
            title: "SCENE 2: SENTUHAN PADA JEMARI",
            text: "Dia menggenggam jemarimu, mencoba membawanya ke bibirnya untuk memberikan kecupan yang hangat dan intens.",
            terimaText: "Menerima kecupannya dan membalas menggenggam erat tangannya.",
            tolakText: "Menolak kecupan itu dengan menarik tangannya perlahan sambil tersenyum.",
            resTerima: "Bibirnya menyentuh kulitmu lembut. Sensasi hangat seketika menjalar ke seluruh tubuhmu.",
            resTolak: "Kamu menarik tanganmu. Dia terkekeh pelan, merasa tertantang oleh sikapmu yang jual mahal."
        },
        3: {
            title: "SCENE 3: TATAPAN DAN RELEVANSI TARIKAN",
            text: "Lampu dimatikan, tersisa remang lilin. Pasanganmu menatap bibirmu dan perlahan mendekatkan wajahnya untuk menciummu.",
            terimaText: "Menerima ciumannya dan memejamkan mata dalam pasrah.",
            tolakText: "Menolak ciuman itu dengan memalingkan wajah ke samping.",
            resTerima: "Bibir kalian menyatu dalam pautan yang dalam dan menggairahkan. Suasana kamar seketika memanas.",
            resTolak: "Ciumannya mendarat di pipimu. Dia berbisik lirih di telingamu, 'Kamu suka bermain-main malam ini...'"
        },
        4: {
            title: "SCENE 4: PERMINTAAN LELAP",
            text: "Tangan pasanganmu mulai merambat ke kancing bajumu, berniat membukanya satu per satu untuk mengikis jarak kain di antara kalian.",
            terimaText: "Menerima tangannya dan membiarkannya melepaskan pakaianmu.",
            tolakText: "Menolak dan memegang tangannya agar berhenti sejenak.",
            resTerima: "Pakaian terlepas perlahan. Tatapan matanya penuh kagum melihat keindahan tubuhmu di bawah remang cahaya.",
            resTolak: "Kamu menghentikan tangannya. Dia mengangguk paham, lalu mengganti fokusnya mengelus rambutmu penuh kesabaran."
        },
        5: {
            title: "SCENE 5: PIJATAN DAN KEHANGATAN",
            text: "Dia menawarkan diri untuk mengusap dan memijat punggungmu yang tegang agar suasana menjadi lebih rileks dan mesra.",
            terimaText: "Menerima tawarannya dan merebahkan diri dalam posisinya.",
            tolakText: "Menolak pijatannya dan memilih untuk tetap duduk tegak.",
            resTerima: "Pijatan lembut jemarinya membuat seluruh ketegangan tubuhmu meleleh digantikan gelombang rasa nyaman.",
            resTolak: "Kamu memilih tetap duduk. Dia mengitarimu dan memilih memangku wajahmu dengan kedua tangannya."
        },
        6: {
            title: "SCENE 6: CIUMAN LEHER YANG MENGGODA",
            text: "Pasanganmu menunduk, mencoba mendaratkan bisikan dan kecupan-kecupan basah di sepanjang garis lehermu.",
            terimaText: "Menerima sentuhan itu dan mendongakkan kepala memberi akses.",
            tolakText: "Menolak dengan mendorong bahunya pelan karena merasa terlalu geli.",
            resTerima: "Desahan halus lolos dari bibirmu saat sentuhannya memicu getaran hebat di sejujur tubuh.",
            resTolak: "Kamu tertawa dan mendorongnya. Dia tertawa bersama, menikmati momen canda tawa yang intim ini."
        },
        7: {
            title: "SCENE 7: PERNYATAAN CINTA DI AMBANG HASRAT",
            text: "Dengan napas yang mulai berpacu, dia menatap matamu dalam-dalam dan meminta komitmenmu untuk menyerahkan malam ini sepenuhnya kepadanya.",
            terimaText: "Menerima permintaannya dan mengangguk penuh keyakinan.",
            tolakText: "Menolak berjanji dan memintanya mengikuti alur dengan santai.",
            resTerima: "Senyum bahagia terukir di wajahnya. Penyatuan emosional kalian terasa makin utuh dan dalam.",
            resTolak: "Dia tersenyum misterius. Ketiadaan janji justru membuat ikatan malam ini terasa makin menegangkan."
        },
        8: {
            title: "SCENE 8: PUNCAK RITME KEERSAMAAN",
            text: "Kehangatan mencapai puncaknya. Dia mengajakmu untuk mempercepat ritme dan membiarkan gairah menguasai kalian berdua.",
            terimaText: "Menerima ajakannya dan mengikuti ritme gairah tersebut.",
            tolakText: "Menolak ritme cepat dan memintanya memperlambat gerakan.",
            resTerima: "Gairah meledak tanpa hambatan, membawa kalian berdua melayang dalam kenikmatan sensual.",
            resTolak: "Tempo melambat menjadi sangat halus dan sensual, memperpanjang setiap detik kenikmatan yang ada."
        },
        9: {
            title: "SCENE 9: REBAHAN DALAM PELUKAN",
            text: "Usai gelombang gairah mereda, pasanganmu merentangkan tangan dan memintamu untuk tidur berpelukan di dadanya sepanjang malam.",
            terimaText: "Menerima pelukannya dan merapatkan tubuhmu padanya.",
            tolakText: "Menolak berpelukan erat karena merasa terlalu panas.",
            resTerima: "Kamu bersandar di dadanya, mendengarkan detak jantungnya yang berangsur teratur hingga matamu berat.",
            resTolak: "Kamu berbaring berdampingan sambil menggenggam jemarinya, menikmati angin malam yang menyejukkan."
        }
    };

    function handleChoice(action) {
        const scene = scenes[currentScene];
        if (action === 'terima') {
            terimaCount++;
            feedbackText = scene.resTerima;
        } else {
            tolakCount++;
            feedbackText = scene.resTolak;
        }

        currentScene++;
        if (currentScene <= 9) {
            renderScene();
        } else {
            renderEnding();
        }
    }

    function renderScene() {
        const scene = scenes[currentScene];
        progressText.innerText = `Scene ${currentScene} dari 10`;

        let feedbackHTML = feedbackText ? `<div class="response-text"><b>Respon Pasangan:</b> ${feedbackText}</div>` : '';

        gameContent.innerHTML = `
            <div class="scene-title">${scene.title}</div>
            <div class="story-text">${scene.text}</div>
            ${feedbackHTML}
        `;

        optionsContainer.innerHTML = `
            <button class="btn btn-terima" onclick="handleChoice('terima')">✔ MENERIMA: ${scene.terimaText}</button>
            <button class="btn btn-tolak" onclick="handleChoice('tolak')">✖ MENOLAK: ${scene.tolakText}</button>
        `;
    }

    function renderEnding() {
        progressText.innerText = "SCENE 10: EPILOG";
        let endingTitle = "";
        let endingText = "";

        if (terimaCount >= 7) {
            endingTitle = "ENDING 1: PASRAH DALAM GELORA (Full Acceptance)";
            endingText = "Sikapmu yang selalu menerima membuat malam ini berjalan tanpa hambatan. Gairah dan kehangatan menyatu sempurna tanpa ada keraguan sedikit pun. Kalian berdua tenggelam dalam kepuasan fisik dan emosional yang luar biasa.";
        } else if (tolakCount >= 7) {
            endingTitle = "ENDING 2: PERMAINAN GODAAN (Playful Tease)";
            endingText = "Penolakan dan batasan yang sering kamu berikan justru membuat pasanganmu makin penasaran dan bergairah. Malam berakhir dengan rasa penasaran yang membara dan janji permainan yang lebih panas di lain waktu.";
        } else {
            endingTitle = "ENDING 3: HARMONI DINAMIS (Balanced Game)";
            endingText = "Kombinasi antara menerima dan menolak membuat alur malam ini sangat berwarna. Ada saatnya kalian berpasrah dalam gairah, dan ada saatnya kalian saling menggoda dengan penolakan manis.";
        }

        gameContent.innerHTML = `
            <div class="scene-title">SCENE 10: HASIL AKHIR CERITA</div>
            <div class="story-text">Suara hujan di luar telah reda. Keheningan malam membungkus kalian berdua dalam sisa-sisa kehangatan.</div>
            <div class="response-text" style="margin-bottom: 12px;">
                <b>Statistik Pilihan Anda:</b><br>
                - Menerima: ${terimaCount} kali<br>
                - Menolak: ${tolakCount} kali
            </div>
            <div class="ending-box">
                <div class="ending-type">${endingTitle}</div>
                <div class="story-text" style="text-align: center; margin-bottom: 0;">${endingText}</div>
            </div>
        `;

        optionsContainer.innerHTML = `
            <button class="btn" style="text-align: center;" onclick="initGame()">Mainkan Ulang</button>
        `;
    }

    initGame();
</script>
</body>
</html>
