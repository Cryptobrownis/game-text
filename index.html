<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Satu Malam Tanpa Batas - Episode 1</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #060508;
            color: #eaeaea;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            background-color: #0f0d14;
            box-shadow: 0 0 40px rgba(0,0,0,0.95);
        }
        #header {
            padding: 16px;
            text-align: center;
            background-color: #060508;
            border-bottom: 1px solid #201c2b;
            font-size: 0.8em;
            letter-spacing: 2px;
            color: #ff3366;
            text-transform: uppercase;
            font-weight: 700;
        }
        #story-area {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 0.98em;
        }
        .story-narrative {
            margin-bottom: 20px;
            animation: fadeIn 0.4s ease-out;
        }
        .dialogue-card {
            background-color: #171421;
            border-radius: 12px;
            border-left: 3px solid #ff3366;
            padding: 14px;
            margin-bottom: 12px;
        }
        .dialogue-card p {
            margin: 0;
            color: #dcdde1;
        }
        .dialogue-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #ff3366;
            display: none;
        }
        .upload-dialog-btn {
            display: inline-block;
            margin-bottom: 8px;
            padding: 6px 10px;
            background-color: #261f35;
            color: #ff85a2;
            border: 1px dashed #ff3366;
            border-radius: 6px;
            font-size: 0.78em;
            cursor: pointer;
        }
        .upload-dialog-btn input[type="file"] {
            display: none;
        }
        .reader-choice {
            margin-bottom: 20px;
            padding: 14px 18px;
            background: linear-gradient(135deg, #a55eea, #ff3366);
            color: #ffffff;
            border-radius: 14px;
            text-align: right;
            margin-left: 15%;
            animation: fadeIn 0.4s ease-out;
            font-weight: 500;
        }
        .cliffhanger-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #2b0914;
            border: 1px solid #ff3366;
            border-radius: 10px;
            text-align: center;
            color: #ff99b3;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #choice-area {
            padding: 16px;
            background-color: #060508;
            border-top: 1px solid #201c2b;
        }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            background-color: #171421;
            color: #ff85a2;
            border: 1px solid #ff3366;
            border-radius: 12px;
            font-size: 0.92em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            line-height: 1.4;
        }
        .choice-btn:active {
            background-color: #ff3366;
            color: #ffffff;
            transform: scale(0.98);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="header">Episode 1: Bisikan Rahasia Malam</div>
    <div id="story-area"></div>
    <div id="choice-area"></div>
</div>

<script>
    const storyData = {
        scene1: {
            narrative: [
                "[Scene 1 dari 10 - Tatap Muka di Kamar]",
                "Hujan deras mengguyur kota sejak senja. Di dalam kamar berlapis dinding kayu ini, hanya ada pendar redup dari lampu meja yang memantulkan bayangan kalian berdua.",
                "Dia berdiri persis di depan jendela kaca yang berembun, membelakangimu. Gaun tipis yang kamu kenakan terasa sejuk terkena hawa pendingin ruangan.",
                "\"Kamu tahu... aku seharusnya tidak berada di sini malam ini,\" ucapnya pelan. Suara beratnya bergetar di tengah suara hujan."
            ],
            choices: [
                { text: "[Mendekat pelan] 'Tapi kamu tetap datang, kan?'", next: 'scene2_a' },
                { text: "[Duduk di tepi ranjang] 'Kalau mau pergi, pintunya tidak dikunci.'", next: 'scene2_b' }
            ]
        },
        scene2_a: {
            narrative: [
                "[Scene 2 dari 10 - Pangkas Jarak]",
                "Dia berbalik perlahan. Tatapannya terkunci rapat pada matamu, memancarkan intensitas emosi yang sulit disembunyikan.",
                "Langkahnya mantap mendekatimu, memangkas jarak yang tersisa hingga tubuhnya berdiri sangat dekat di hadapanmu.",
                "\"Aku datang karena kamu yang minta. Dan aku tidak pernah bisa menolak kamu,\" bisiknya serak."
            ],
            choices: [
                { text: "[Tatap bibirnya] 'Lalu kenapa kamu masih diam?'", next: 'scene3' }
            ]
        },
        scene2_b: {
            narrative: [
                "[Scene 2 dari 10 - Tantangan]",
                "Dia terkekeh rendah, suara khas yang selalu membuat dadamu berdesir. Bukannya berjalan menuju pintu, dia justru melangkah lurus ke arah ranjang tempatmu duduk.",
                "Dia meletakkan kedua tangannya di sisi kiri dan kanan tubuhmu, mengurungmu dalam kehangatan napasnya.",
                "\"Kamu tahu betul aku tidak akan pernah melangkah keluar dari pintu itu malam ini,\" ujarnya tajam."
            ],
            choices: [
                { text: "[Genggam kerah bajunya] 'Buktikan ucapanmu.'", next: 'scene3' }
            ]
        },
        scene3: {
            narrative: [
                "[Scene 3 dari 10 - Sentuhan Pertama]",
                "Jemarinya terulur perlahan, menyentuh rahangmu dengan sangat lembut. Usapan punggung tangannya merambat turun ke lehermu, mengirimkan getaran halus yang membuatmu menahan napas.",
                "Aroma parfum maskulin bercampur hangat tubuhnya memenuhi rongga dadamu.",
                "\"Setiap sentuhanmu selalu membuatku lupa cara berpikir jernih,\" akunya lurus, menatap matamu yang mulai meredup oleh gelora emosi."
            ],
            choices: [
                { text: "[Sandarkan wajah di telapak tangannya] 'Jangan berpikir. Cukup rasakan.'", next: 'scene4' }
            ]
        },
        scene4: {
            narrative: [
                "[Scene 4 dari 10 - Tarik Ulur Emosi]",
                "Dia menarik napas panjang, menahan dorongan hasrat yang kian membuncah. Jemarinya menyelip di antara helai rambut belakangmu, menahan kepalamu agar tidak berpaling.",
                "\"Kamu bermain api, sayang. Dan malam ini api itu bisa membakar kita berdua,\" bisiknya tepat di depan bibirmu.",
                "Jarak di antara wajah kalian kini tak lebih dari seujung jari."
            ],
            choices: [
                { text: "[Bisikkan kata manja] 'Biarkan membakar sampai habis...'", next: 'scene5' }
            ]
        },
        scene5: {
            narrative: [
                "[Scene 5 dari 10 - Mengunci Dunia Luar]",
                "Tanpa melepas tatapannya, tangannya yang lain terulur ke belakang, mematikan sakelar lampu utama. Ruangan seketika tenggelam dalam temaram yang makin pekat.",
                "Hanya ada suara deru hujan dan hembusan napas kalian yang saling memburu.",
                "\"Mulai detik ini, dunia di luar tidak lagi ada. Hanya ada kamu dan aku,\" tegasnya rapat."
            ],
            choices: [
                { text: "[Rapatkan tubuhmu padanya] 'Genggam aku lebih erat.'", next: 'scene6' }
            ]
        },
        scene6: {
            narrative: [
                "[Scene 6 dari 10 - Pengakuan Dalam Temaram]",
                "Kedua tangannya melingkar sempurna di pinggangmu, menarik tubuhmu rapat tanpa menyisakan celah. Kamu bisa merasakan detak jantungnya yang bergemuruh kencang di balik dadanya.",
                "\"Aku sudah menahan rasa ini terlalu lama,\" bisiknya di lehermu, membuat desah napas halus terlepas dari bibirmu.",
                "\"Malam ini aku mau semuanya dari kamu.\""
            ],
            choices: [
                { text: "[Kecup rahangnya] 'Aku milikmu malam ini.'", next: 'scene7' }
            ]
        },
        scene7: {
            narrative: [
                "[Scene 7 dari 10 - Ketegangan Puncak]",
                "Suasana makin memanas. Setiap usapan dan belaian lembutnya membuat getaran asmara di dalam dada kian meluap.",
                "Dia merendahkan tubuhnya, hendak menyatukan bibir kalian dalam tautan yang paling dalam dan dinantikan sejak tadi.",
                "Dada kalian berdua bergelombang cepat, larut dalam hasrat yang makin sulit dikendalikan."
            ],
            choices: [
                { text: "[Meramkan mata dan pasrah]", next: 'scene8' }
            ]
        },
        scene8: {
            narrative: [
                "[Scene 8 dari 10 - Hambatan Tak Terduga]",
                "Tepat saat napas kalian menyatu dan sentuhan hangat itu tinggal sepersekian detik lagi...",
                "TIBA-TIBA! *BZZZZT... BZZZZT...*",
                "Ponselnya yang tergeletak di atas meja kayu bergetar hebat. Layar ponsel menyala terang di tengah kegelapan ruangan, menampilkan nama kontak yang membuat tubuhnya seketika membeku."
            ],
            choices: [
                { text: "[Buka mata dan tatap dia] 'Siapa itu?'", next: 'scene9' }
            ]
        },
        scene9: {
            narrative: [
                "[Scene 9 dari 10 - Rahasia Terkuak]",
                "Napasnya tertahan. Raut wajahnya berubah drastis dari penuh gairah menjadi pucat ketakutan.",
                "Nama yang tertera di layar ponsel itu adalah nama seseorang dari masa lalu yang seharusnya sudah menghilang... atau rahasia besar yang selama ini dia sembunyikan darimu.",
                "Dia melepaskan pegangannya di pinggangmu perlahan, menatap layar itu dengan jemari bergetar."
            ],
            choices: [
                { text: "[Tarik tangannya] 'Jawab aku, siapa yang menelepon malam-malam begini?!'", next: 'scene10' }
            ]
        },
        scene10: {
            narrative: [
                "[Scene 10 dari 10 - AKHIR EPISODE 1]",
                "Belum sempat dia menjawab pertanyaanmu, suara gedoran keras tiba-tiba terdengar dari luar pintu kamar!",
                "*BAM! BAM! BAM!*",
                "\"Buka pintunya! Aku tahu kalian di dalam!\" histeris suara seorang wanita dari balik pintu, diiringi petir yang menyambar keras di luar.",
                "Dia menatapmu dengan mata membelalak penuh rasa bersalah. Kilatan petir menerangi wajahnya yang kini panik.",
                "\"Maafkan aku...\" bisiknya lirih, sebelum gagang pintu kamar mulai bergerak berputar dari luar..."
            ],
            choices: [
                { text: "BERSAMBUNG KE EPISODE 2", next: 'end' }
            ]
        },
        end: {
            narrative: [
                "Terima kasih telah membaca Episode 1!",
                "Kisah cinta, rahasia, dan konflik akan berlanjut di Episode 2."
            ],
            choices: [
                { text: "Ulangi Episode 1 dari awal", next: 'scene1' }
            ]
        }
    };

    const storyArea = document.getElementById('story-area');
    const choiceArea = document.getElementById('choice-area');

    function renderNode(nodeId, readerChoiceText = null) {
        const node = storyData[nodeId];
        choiceArea.innerHTML = '';

        if (readerChoiceText) {
            const readerDiv = document.createElement('div');
            readerDiv.className = 'reader-choice';
            readerDiv.innerText = readerChoiceText;
            storyArea.appendChild(readerDiv);
        }

        setTimeout(() => {
            const narrativeContainer = document.createElement('div');
            narrativeContainer.className = 'story-narrative';

            node.narrative.forEach((text) => {
                const card = document.createElement('div');
                card.className = 'dialogue-card';

                const img = document.createElement('img');
                img.className = 'dialogue-img';

                const uploadLabel = document.createElement('label');
                uploadLabel.className = 'upload-dialog-btn';
                uploadLabel.innerHTML = '📷 Tambah Foto <input type="file" accept="image/*">';

                const fileInput = uploadLabel.querySelector('input');
                fileInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        img.src = URL.createObjectURL(file);
                        img.style.display = 'block';
                        uploadLabel.innerHTML = '🔄 Ganti Foto <input type="file" accept="image/*">';
                        // pasang event listener baru untuk tombol ganti foto
                        uploadLabel.querySelector('input').onchange = fileInput.onchange;
                    }
                };

                const p = document.createElement('p');
                p.innerText = text;

                card.appendChild(img);
                card.appendChild(uploadLabel);
                card.appendChild(p);
                narrativeContainer.appendChild(card);
            });

            if (nodeId === 'scene10') {
                const cliffDiv = document.createElement('div');
                cliffDiv.className = 'cliffhanger-box';
                cliffDiv.innerText = "— BERSAMBUNG KE EPISODE 2 —";
                narrativeContainer.appendChild(cliffDiv);
            }

            storyArea.appendChild(narrativeContainer);
            storyArea.scrollTop = storyArea.scrollHeight;

            node.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice.text;
                btn.onclick = () => renderNode(choice.next, choice.text);
                choiceArea.appendChild(btn);
            });
        }, 300);
    }

    renderNode('scene1');
</script>

</body>
</html>
